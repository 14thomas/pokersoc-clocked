<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Shot Clock</title>
<meta name="theme-color" content="#071120">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shot Clock">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/Campton-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/Campton-Bold.otf" as="font" type="font/otf" crossorigin>
<style>
  @font-face {
    font-family: "Campton"; font-weight: 500; font-style: normal; font-display: swap;
    src: url("fonts/Campton-Medium.otf") format("opentype");
  }
  @font-face {
    font-family: "Campton"; font-weight: 700; font-style: normal; font-display: swap;
    src: url("fonts/Campton-Bold.otf") format("opentype");
  }

  :root {
    --bg: #071120;
    --text: #EEF2F5;
    --accent: #9FA2E5;
    --accent-border: #B4B6EE;
    --accent-ink: #14152B;
    --red: #F28B82;
    --yellow: #E5E29F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    position: fixed; inset: 0; overflow: hidden;
    color: var(--text);
    font-family: "Campton", "Arial Narrow", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    touch-action: none;
    overscroll-behavior: none;
  }

  .app {
    height: 100%;
    display: flex; flex-direction: column; gap: 12px;
    padding: max(14px, env(safe-area-inset-top)) max(30px, env(safe-area-inset-right))
             max(14px, env(safe-area-inset-bottom)) max(30px, env(safe-area-inset-left));
  }

  /* ---- clock (upside-down, so it faces the players) ---- */
  .clock {
    flex: 1; min-height: 0;
    container-type: size;
    display: flex; align-items: center; justify-content: center;
  }
  .digits {
    transform: rotate(180deg);
    font-family: "Campton", "Arial Narrow", system-ui, sans-serif;
    font-weight: 500;
    font-size: calc((100svh - 160px) * 0.8);   /* fallback */
    font-size: min(80cqh, 52cqw);
    line-height: 1;
    letter-spacing: -0.01em;
    font-variant-numeric: lining-nums tabular-nums;
    color: var(--red);
    text-shadow: 0 0 0.075em rgba(242, 139, 130, 0.45);
    transition: opacity 120ms linear;
  }
  .app[data-state="idle"]   .digits { opacity: 0.35; text-shadow: none; }
  .app[data-state="paused"] .digits { color: var(--yellow); text-shadow: 0 0 0.075em rgba(229, 226, 159, 0.35); }
  .app.warn:not(.flash) .digits { opacity: 0.35; }   /* last 5 s: pulses once a second */

  /* ---- logo (top-left corner) ---- */
  .logo {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    left: max(30px, env(safe-area-inset-left));
    height: 44px; width: auto;
    opacity: 0.85;
    pointer-events: none;
  }

  /* ---- reset ---- */
  .reset {
    -webkit-appearance: none; appearance: none;
    flex: none; align-self: center;
    width: min(360px, 60vw);
    height: clamp(80px, 28svh, 128px);
    display: flex; align-items: center; justify-content: center;
    font-family: "Campton", "Arial Narrow", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 10svh, 44px);
    line-height: 1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--accent-ink);
    background: var(--accent);
    border: 2px solid var(--accent-border);
    border-radius: 22px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 18px 40px -18px rgba(159, 162, 229, 0.6);
    cursor: pointer;
    touch-action: none;
    transition: transform 70ms ease, filter 70ms ease;
  }
  .reset.pressed { transform: scale(0.975); filter: brightness(0.88); }
  .reset:focus { outline: none; }
  .reset:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }

  /* ---- portrait: ask for landscape ---- */
  .rotate { display: none; }
  @media (orientation: portrait) {
    .rotate {
      display: grid; place-items: center; text-align: center;
      position: fixed; inset: 0; z-index: 10; padding: 24px;
      background: var(--bg);
      font-weight: 700; font-size: 28px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent);
    }
  }
</style>
</head>
<body>
<img class="logo" src="logo.png" alt="PokerSoc" width="29" height="44">
<main class="app" id="app" data-state="idle">
  <section class="clock" id="clock" aria-label="Shot clock. Tap to pause or resume.">
    <div class="digits" id="digits" role="timer">30</div>
  </section>
  <button class="reset" id="reset" type="button" aria-label="Reset clock to 30 seconds">Reset clock</button>
</main>
<div class="rotate">Rotate your phone</div>

<script>
(() => {
  'use strict';

  const SHOT_SECONDS = 30;      // what Reset clock sets the timer to
  const WARN_AT = 5;            // pulse + beep from this many seconds left

  const SHOT_MS = SHOT_SECONDS * 1000;
  const app = document.getElementById('app');
  const digits = document.getElementById('digits');
  const button = document.getElementById('reset');
  digits.textContent = String(SHOT_SECONDS);

  let state = 'idle';           // idle | running | paused | expired
  let deadline = 0;             // performance.now() when the clock hits 0
  let remaining = SHOT_MS;      // ms left while paused
  let raf = 0;
  let shownSecs = null;

  // ---------- display ----------
  // Remaining time is always deadline - now, so the clock can't drift.
  function render() {
    let rem = SHOT_MS;
    if (state === 'running') {
      rem = deadline - performance.now();
      if (rem <= 0) { rem = 0; state = 'expired'; }
    } else if (state === 'paused') {
      rem = remaining;
    } else if (state === 'expired') {
      rem = 0;
    }

    const secs = Math.ceil(rem / 1000);
    if (secs !== shownSecs) { digits.textContent = String(secs); shownSecs = secs; }

    const warn = state === 'running' && rem <= WARN_AT * 1000;
    const flash = warn && rem - (secs - 1) * 1000 > 500;   // lit for the first half of each second
    if (app.dataset.state !== state) app.dataset.state = state;
    app.classList.toggle('warn', warn);
    app.classList.toggle('flash', flash);

    return state === 'running';
  }

  function loop() {
    cancelAnimationFrame(raf);
    const tick = () => { if (render()) raf = requestAnimationFrame(tick); };
    tick();
  }

  // ---------- actions ----------
  function reset() {
    deadline = performance.now() + SHOT_MS;
    state = 'running';
    cancelBeeps();
    scheduleBeeps();
    loop();
  }

  function togglePause() {
    if (state === 'running') {
      remaining = Math.max(0, deadline - performance.now());
      state = 'paused';
      cancelBeeps();
      loop();
    } else if (state === 'paused') {
      deadline = performance.now() + remaining;
      state = 'running';
      scheduleBeeps();
      loop();
    }
  }

  // ---------- sound ----------
  // 'playback' lets the beeps play with the silent switch on (iOS 17+).
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}

  let ctx = null;
  let nodes = [];
  let beepsFor = 0;             // deadline the current beeps were scheduled for

  // iOS only starts audio from a completed tap, so this runs on pointerup/click.
  function unlockAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) { try { ctx = new AC(); } catch (_) { return; } }
    if (ctx.state === 'running') { scheduleBeeps(); return; }
    try {
      const s = ctx.createBufferSource();
      s.buffer = ctx.createBuffer(1, 1, 22050);
      s.connect(ctx.destination);
      s.start(0);
    } catch (_) {}
    ctx.resume().then(() => scheduleBeeps(), () => {});
  }

  function tone(at, freq, dur) {
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    amp.gain.setValueAtTime(0, at);
    amp.gain.linearRampToValueAtTime(0.2, at + 0.005);
    amp.gain.setValueAtTime(0.2, at + dur - 0.01);
    amp.gain.linearRampToValueAtTime(0, at + dur);
    osc.connect(amp).connect(ctx.destination);
    osc.start(at);
    osc.stop(at + dur + 0.02);
    nodes.push(osc);
  }

  function cancelBeeps() {
    for (const n of nodes) {
      try { n.stop(); } catch (_) {}
      try { n.disconnect(); } catch (_) {}
    }
    nodes = [];
    beepsFor = 0;
  }

  // Beeps go on the audio clock up front, so they land exactly on 5 and 0.
  function scheduleBeeps() {
    if (state !== 'running' || !ctx || ctx.state !== 'running' || beepsFor === deadline) return;
    cancelBeeps();
    const rem = (deadline - performance.now()) / 1000;
    const t = ctx.currentTime;
    if (rem - WARN_AT > 0.05) tone(t + rem - WARN_AT, 1320, 0.12);   // 5 s: short pip
    if (rem > 0.05) {                                                   // 0: beep-beep-beeeep
      tone(t + rem, 880, 0.14);
      tone(t + rem + 0.22, 880, 0.14);
      tone(t + rem + 0.44, 880, 0.5);
    }
    beepsFor = deadline;
  }

  // ---------- keep the screen on ----------
  let wakeLock = null;
  let wakePending = false;
  function keepAwake() {
    if (!('wakeLock' in navigator) || wakePending || (wakeLock && !wakeLock.released)) return;
    wakePending = true;
    navigator.wakeLock.request('screen')
      .then((lock) => { wakeLock = lock; }, () => {})
      .finally(() => { wakePending = false; });
  }

  // ---------- input ----------
  const portrait = window.matchMedia('(orientation: portrait)');

  // Reset fires on touch-down, so there's no lag.
  button.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    button.classList.add('pressed');
    reset();
  });
  const release = () => button.classList.remove('pressed');
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => button.addEventListener(t, release));

  // Tap anywhere else: pause / resume.
  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#reset') || portrait.matches) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    togglePause();
  });

  // Audio and wake lock need a completed tap (touchend/click), not touch-down.
  const activate = () => { unlockAudio(); keepAwake(); };
  ['pointerup', 'touchend', 'click', 'keydown'].forEach((t) => document.addEventListener(t, activate, true));

  // Keyboard / Bluetooth clicker: Enter, arrows or Page Down reset; Space or Esc pause / resume.
  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (['Enter', 'ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key)) { e.preventDefault(); reset(); }
    else if (e.key === ' ' || e.key === 'Escape') { e.preventDefault(); togglePause(); }
  });

  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loop(); });

  // Offline support once it's been opened once.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  render();
})();
</script>
</body>
</html>
